name: Build TaskOrbit APK

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk TaskOrbit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0
          name: "TaskOrbit (Offline Vault)"
          files: TaskOrbit.apk
