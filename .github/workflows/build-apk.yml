name: Build TaskOrbit APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaskOrbit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaskOrbit-APK
          path: TaskOrbit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-release-${{ github.run_number }}
          name: "TaskOrbit Build #${{ github.run_number }}"
          files: TaskOrbit.apk
